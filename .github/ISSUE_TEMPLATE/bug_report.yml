name: Bug report
description: Report a reproducible monitor defect without sensitive data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or secrets here. Follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and include redacted evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected behavior from current code or documentation.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest complete reproduction sequence.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Monitor profile
      options:
        - core
        - full
        - unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or release tag
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, PostgreSQL, and OS versions. Redact URLs and credentials.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private RPC URLs, private keys, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
